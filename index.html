<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全国お天気プリント</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background-color: #f4f4f9; }
        .container { width: 100%; max-width: 400px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        label { font-size: 12px; color: #666; margin-bottom: -5px; margin-left: 5px; }
        button { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; background-color: #2c3e50; color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 5px; }
        pre { background: #fff; padding: 15px; border: 2px solid #ddd; font-family: 'Courier New', monospace; font-size: 14px; white-space: pre; overflow-x: auto; }
        .msg { color: #e67e22; text-align: center; font-size: 14px; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="input-group">
        <label>場所 (例: 瑞浪, 土岐, 多治見, 渋谷)</label>
        <input type="text" id="cityInput" placeholder="地名を検索...">
        
        <label>いつの天気？</label>
        <input type="date" id="dateInput">
    </div>

    <button onclick="fetchWeather()">天気を取得＆コピー</button>
    <div id="status" class="msg"></div>
    <pre id="output">場所と日付を入力してください</pre>
</div>

<script>
    // 初期日付を昨日に設定
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    document.getElementById('dateInput').value = yesterday.toISOString().split('T')[0];

    async function fetchWeather() {
        const cityQuery = document.getElementById('cityInput').value.trim();
        const targetDate = document.getElementById('dateInput').value;
        const status = document.getElementById('status');
        const output = document.getElementById('output');

        if (!cityQuery) { status.textContent = "地名を入力してください"; return; }
        status.textContent = "場所を特定中...";

        try {
            // 1. Nominatim (OpenStreetMap) で地名を検索
            // これにより、かなり曖昧な入力でも日本の住所を優先的に探せます
            const geoUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cityQuery)}&accept-language=ja&limit=1&countrycodes=jp`;
            const geoRes = await fetch(geoUrl);
            const geoData = await geoRes.json();

            if (geoData.length === 0) {
                status.textContent = "場所が見つかりませんでした";
                return;
            }

            const loc = geoData[0];
            const lat = loc.lat;
            const lon = loc.lon;
            const displayName = loc.display_name.split(',')[0]; // 最初に出てくる地名を採用

            status.textContent = "お天気を取得中...";

            // 2. Open-Meteoで履歴を取得
            const archiveUrl = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${targetDate}&end_date=${targetDate}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=Asia%2FTokyo`;
            const archiveRes = await fetch(archiveUrl);
            const archiveData = await archiveRes.json();

            const d = new Date(targetDate);
            const dateStr = d.toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });

            const text = 
`【 天気記録：${displayName} 】
  ${dateStr}

■ その日の実績
----------------------------
　最高温：${archiveData.daily.temperature_2m_max[0]}℃
　最低温：${archiveData.daily.temperature_2m_min[0]}℃
　降水量：${archiveData.daily.precipitation_sum[0]}mm

----------------------------
   Global Weather Archive`.trim();

            output.textContent = text;
            await navigator.clipboard.writeText(text);
            status.textContent = "✓ コピーしました！";

        } catch (err) {
            status.textContent = "エラーが発生しました";
            output.textContent = err;
        }
    }
</script>
</body>
</html>
