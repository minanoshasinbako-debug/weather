<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お天気ログ ☁️✨</title>
    <style>
        :root {
            --primary-color: #7fbcc1; /* 優しい水色 */
            --accent-color: #ffb7b2;  /* 可愛いピンク */
            --bg-color: #fdfcf0;      /* 柔らかなクリーム色 */
            --text-color: #5a5a5a;
        }
        body { 
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 20px; background-color: var(--bg-color); color: var(--text-color);
        }
        .container { width: 100%; max-width: 380px; }
        
        /* タイトル部分 */
        h1 { font-size: 1.2rem; text-align: center; color: var(--primary-color); margin-bottom: 20px; }

        .card {
            background: white; padding: 20px; border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px;
        }

        .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        
        label { font-size: 0.8rem; font-weight: bold; color: var(--primary-color); padding-left: 5px; }
        
        input { 
            width: 100%; padding: 12px; font-size: 16px; 
            border: 2px solid #f0f0f0; border-radius: 12px; box-sizing: border-box;
            outline: none; transition: border-color 0.3s;
        }
        input:focus { border-color: var(--primary-color); }

        button { 
            width: 100%; padding: 16px; font-size: 18px; font-weight: bold; 
            background-color: var(--primary-color); color: white; 
            border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 4px 0 #6aa7ac; transition: all 0.2s;
        }
        button:active { transform: translateY(2px); box-shadow: 0 2px 0 #6aa7ac; }

        #status { 
            color: var(--accent-color); text-align: center; font-size: 0.9rem; 
            font-weight: bold; margin: 10px 0; min-height: 1.2em; 
        }

        /* 出力プレビューエリア */
        pre { 
            background: #f9f9f9; padding: 15px; border-radius: 12px;
            border: 1px dashed #ccc; font-family: 'Courier New', monospace; 
            font-size: 12px; line-height: 1.4; color: #444; overflow-x: auto;
        }
        
        .footer { font-size: 0.7rem; text-align: center; color: #bbb; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>☁️ Weather Log Tool ☁️</h1>
    
    <div class="card">
        <div class="input-group">
            <label>📍 どこを調べますか？</label>
            <input type="text" id="cityInput" placeholder="瑞浪, 土岐, 渋谷..." value="瑞浪">
            
            <label>📅 いつを振り返りますか？</label>
            <input type="date" id="dateInput">
        </div>

        <button onclick="fetchFullWeather()">データをあつめる ✨</button>
        <div id="status" class="msg"></div>
    </div>

    <div class="card" style="padding: 10px;">
        <pre id="output">ここにレポートが表示されます</pre>
    </div>

    <div class="footer">powered by Open-Meteo</div>
</div>

<script>
    // 初期日付の設定（昨日）
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    document.getElementById('dateInput').value = yesterday.toISOString().split('T')[0];

    async function fetchFullWeather() {
        const cityQuery = document.getElementById('cityInput').value.trim();
        const targetDate = document.getElementById('dateInput').value;
        const status = document.getElementById('status');
        const output = document.getElementById('output');

        if (!cityQuery) { status.textContent = "地名をおしえてね！"; return; }
        status.textContent = "場所をさがしているよ...";

        try {
            const geoUrl = `https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(cityQuery)}`;
            const geoRes = await fetch(geoUrl);
            const geoData = await geoRes.json();

            if (geoData.length === 0) {
                status.textContent = "場所が見つからなかったよ 💦";
                return;
            }

            const lon = geoData[0].geometry.coordinates[0];
            const lat = geoData[0].geometry.coordinates[1];
            const displayName = geoData[0].properties.title;

            status.textContent = "データをお取り寄せ中...";

            const currentUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=Asia%2FTokyo`;
            const archiveUrl = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${targetDate}&end_date=${targetDate}&daily=temperature_2m_max,temperature_2m_min,relative_humidity_2m_mean,precipitation_sum,et0_fao_evapotranspiration&timezone=Asia%2FTokyo`;

            const [curRes, arcRes] = await Promise.all([fetch(currentUrl), fetch(archiveUrl)]);
            const curData = await curRes.json();
            const arcData = await arcRes.json();

            const weatherMap = {0:"快晴", 1:"晴れ", 2:"一部曇", 3:"曇り", 45:"霧", 51:"小雨", 61:"雨", 71:"雪", 95:"雷雨"};
            const curCondition = weatherMap[curData.current.weather_code] || "不明";

            const dObj = new Date(targetDate);
            const dateStr = dObj.toLocaleDateString('ja-JP', { month: '2-digit', day: '2-digit', weekday: 'short' });
            const nowTime = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

            const text = 
`【 天気レポート：${displayName} 】

■ 現在の観測 (${nowTime})
----------------------------
　天気　：${curCondition}
　気温　：${curData.current.temperature_2m}℃
　湿度　：${curData.current.relative_humidity_2m}%
　風速　：${curData.current.wind_speed_10m}m/s

■ 過去の実績 (${dateStr})
----------------------------
　最高温：${arcData.daily.temperature_2m_max[0]}℃
　最低温：${arcData.daily.temperature_2m_min[0]}℃
　平均湿：${Math.round(arcData.daily.relative_humidity_2m_mean[0])}%
　降水量：${arcData.daily.precipitation_sum[0]}mm
　蒸発量：${arcData.daily.et0_fao_evapotranspiration[0]}mm

----------------------------
   Open-Meteo Mixed Report`.trim();

            output.textContent = text;
            await navigator.clipboard.writeText(text);
            status.textContent = "✓ 魔法でコピーしたよ！ ✨";

        } catch (err) {
            status.textContent = "エラーになっちゃった 💦";
            output.textContent = err;
        }
    }
</script>
</body>
</html>
