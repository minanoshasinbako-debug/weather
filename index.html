<script>
    // 初期日付を昨日に設定
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    document.getElementById('dateInput').value = yesterday.toISOString().split('T')[0];

    async function fetchWeather() {
        const cityQuery = document.getElementById('cityInput').value.trim();
        const targetDate = document.getElementById('dateInput').value;
        const status = document.getElementById('status');
        const output = document.getElementById('output');

        if (!cityQuery) { status.textContent = "地名を入力してください"; return; }
        status.textContent = "場所を特定中...";

        try {
            // 日本の住所検索に強いAPI (msearch) を利用
            // これなら「瑞浪」だけで緯度経度を高確率で返してくれます
            const geoUrl = `https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(cityQuery)}`;
            const geoRes = await fetch(geoUrl);
            const geoData = await geoRes.json();

            if (geoData.length === 0) {
                status.textContent = "場所が見つかりませんでした";
                return;
            }

            // 検索結果の1番目を使用
            const loc = geoData[0].geometry.coordinates;
            const lon = loc[0]; // 経度
            const lat = loc[1]; // 緯度
            const displayName = geoData[0].properties.title;

            status.textContent = "お天気を取得中...";

            // Open-Meteoで履歴を取得
            const archiveUrl = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${targetDate}&end_date=${targetDate}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=Asia%2FTokyo`;
            const archiveRes = await fetch(archiveUrl);
            const archiveData = await archiveRes.json();

            const d = new Date(targetDate);
            const dateStr = d.toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });

            const text = 
`【 天気記録：${displayName} 】
  ${dateStr}

■ その日の実績
----------------------------
　最高温：${archiveData.daily.temperature_2m_max[0]}℃
　最低温：${archiveData.daily.temperature_2m_min[0]}℃
　降水量：${archiveData.daily.precipitation_sum[0]}mm

----------------------------
   Open-Meteo Japan Log`.trim();

            output.textContent = text;
            await navigator.clipboard.writeText(text);
            status.textContent = "✓ コピーしました！";

        } catch (err) {
            status.textContent = "通信エラーが発生しました";
            output.textContent = err;
        }
    }
</script>
