<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全国お天気履歴・詳細版</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background-color: #f4f4f9; }
        .container { width: 100%; max-width: 400px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        label { font-size: 12px; color: #666; margin-bottom: -5px; margin-left: 5px; }
        button { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; background-color: #2c3e50; color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 5px; }
        button:active { background-color: #1a252f; }
        pre { background: #fff; padding: 15px; border: 2px solid #ddd; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.4; white-space: pre; overflow-x: auto; }
        .msg { color: #e67e22; text-align: center; font-size: 14px; font-weight: bold; margin-bottom: 5px; min-height: 1.2em; }
    </style>
</head>
<body>

<div class="container">
    <div class="input-group">
        <label>場所 (例: 瑞浪, 土岐, 多治見)</label>
        <input type="text" id="cityInput" placeholder="地名を検索..." value="瑞浪">
        
        <label>いつの天気？</label>
        <input type="date" id="dateInput">
    </div>

    <button onclick="fetchWeather()">詳細履歴を取得</button>
    <div id="status" class="msg"></div>
    <pre id="output">地名と日付を入力してください</pre>
</div>

<script>
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    document.getElementById('dateInput').value = yesterday.toISOString().split('T')[0];

    async function fetchWeather() {
        const cityQuery = document.getElementById('cityInput').value.trim();
        const targetDate = document.getElementById('dateInput').value;
        const status = document.getElementById('status');
        const output = document.getElementById('output');

        if (!cityQuery) { status.textContent = "地名を入力してください"; return; }
        status.textContent = "場所を特定中...";

        try {
            // 1. 地名検索
            const geoUrl = `https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(cityQuery)}`;
            const geoRes = await fetch(geoUrl);
            const geoData = await geoRes.json();

            if (geoData.length === 0) {
                status.textContent = "場所が見つかりませんでした";
                return;
            }

            const lon = geoData[0].geometry.coordinates[0];
            const lat = geoData[0].geometry.coordinates[1];
            const displayName = geoData[0].properties.title;

            status.textContent = "詳細データを取得中...";

            // 2. Open-Meteoで詳細な履歴を取得
            // 気温、湿度、降水量、日照時間、蒸発量、風速をリクエスト
            const archiveUrl = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${targetDate}&end_date=${targetDate}&daily=temperature_2m_max,temperature_2m_min,relative_humidity_2m_mean,precipitation_sum,sunshine_duration,et0_fao_evapotranspiration,windspeed_10m_max&timezone=Asia%2FTokyo`;
            
            const archiveRes = await fetch(archiveUrl);
            const archiveData = await archiveRes.json();
            const d = archiveData.daily;

            // データの整形
            const dateObj = new Date(targetDate);
            const dateStr = dateObj.toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });
            
            // 日照時間を時間に変換 (秒 -> 時間)
            const sunHours = (d.sunshine_duration[0] / 3600).toFixed(1);

            const text = 
`【 天気記録：${displayName} 】
  ${dateStr}

■ 気温・湿度
----------------------------
　最高気温：${d.temperature_2m_max[0]}℃
　最低気温：${d.temperature_2m_min[0]}℃
　平均湿度：${Math.round(d.relative_humidity_2m_mean[0])}%

■ 水・風・光
----------------------------
　降水量　：${d.precipitation_sum[0]}mm
　蒸発量　：${d.et0_fao_evapotranspiration[0]}mm
　日照時間：${sunHours}時間
　最大風速：${d.windspeed_10m_max[0]}m/s

----------------------------
   Detailed Weather Archive`.trim();

            output.textContent = text;
            await navigator.clipboard.writeText(text);
            status.textContent = "✓ 全データをコピーしました！";

        } catch (err) {
            status.textContent = "エラーが発生しました";
            output.textContent = err;
        }
    }
</script>
</body>
</html>
