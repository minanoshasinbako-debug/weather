<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お天気ログ ☁️✨</title>
    <style>
        :root {
            --primary-color: #7fbcc1;
            --accent-color: #ffb7b2;
            --bg-color: #fdfcf0;
            --text-color: #5a5a5a;
            --card-bg: #ffffff;
        }
        body { 
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 15px; background-color: var(--bg-color); color: var(--text-color);
            margin: 0;
        }
        .container { width: 100%; max-width: 420px; }
        
        h1 { font-size: 1.4rem; text-align: center; color: var(--primary-color); margin: 15px 0; letter-spacing: 2px; }

        .card {
            background: var(--card-bg); padding: 20px; border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04); margin-bottom: 15px;
        }

        .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        label { font-size: 0.9rem; font-weight: bold; color: var(--primary-color); margin-left: 5px; }
        
        input { 
            width: 100%; padding: 16px; font-size: 18px; /* 入力文字も大きく */
            border: 2px solid #f0f0f0; border-radius: 14px; box-sizing: border-box;
            background: #fafafa; outline: none;
        }

        button { 
            width: 100%; padding: 20px; font-size: 20px; font-weight: bold; 
            background-color: var(--primary-color); color: white; 
            border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 5px 0 #6aa7ac; transition: all 0.2s;
            margin-top: 5px;
        }
        button:active { transform: translateY(2px); box-shadow: 0 2px 0 #6aa7ac; }

        #status { 
            color: var(--accent-color); text-align: center; font-size: 1rem; 
            font-weight: bold; margin: 12px 0; min-height: 1.2em; 
        }

        /* レポート表示エリア：文字を大きく、視認性アップ */
        .report-area {
            background: #fff;
            padding: 20px;
            border-radius: 16px;
            border: 3px solid var(--primary-color); /* 枠を少し太く */
            position: relative;
        }

        pre { 
            margin: 0;
            padding: 0;
            font-family: "Courier New", "MS Gothic", monospace; 
            font-size: 16px; /* プレビュー文字を大きく（13px→16px） */
            font-weight: bold; /* 少し太めに */
            line-height: 1.7; 
            color: #333; 
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .footer { font-size: 0.8rem; text-align: center; color: #ccc; margin: 25px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>☁️ Weather Log ☁️</h1>
    
    <div class="card">
        <div class="input-group">
            <label>📍 場所をさがす</label>
            <input type="text" id="cityInput" placeholder="瑞浪市, 土岐市..." value="瑞浪市">
            
            <label>📅 日付をえらぶ</label>
            <input type="date" id="dateInput">
        </div>

        <button onclick="fetchFullWeather()">データをあつめる ✨</button>
        <div id="status" class="msg"></div>
    </div>

    <div class="report-area">
        <pre id="output">ここにレポートが表示されるよ</pre>
    </div>

    <div class="footer">designed for Phomemo | Open-Meteo</div>
</div>

<script>
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    document.getElementById('dateInput').value = yesterday.toISOString().split('T')[0];

    async function fetchFullWeather() {
        const cityQuery = document.getElementById('cityInput').value.trim();
        const targetDate = document.getElementById('dateInput').value;
        const status = document.getElementById('status');
        const output = document.getElementById('output');

        if (!cityQuery) { status.textContent = "地名をおしえてね！"; return; }
        status.textContent = "場所をさがしているよ...";

        try {
            const geoUrl = `https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(cityQuery)}`;
            const geoRes = await fetch(geoUrl);
            const geoData = await geoRes.json();

            if (geoData.length === 0) {
                status.textContent = "場所が見つからなかったよ 💦";
                return;
            }

            const lon = geoData[0].geometry.coordinates[0];
            const lat = geoData[0].geometry.coordinates[1];
            const displayName = geoData[0].properties.title;

            status.textContent = "データをお取り寄せ中...";

            const currentUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=Asia%2FTokyo`;
            const archiveUrl = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${targetDate}&end_date=${targetDate}&daily=temperature_2m_max,temperature_2m_min,relative_humidity_2m_mean,precipitation_sum,et0_fao_evapotranspiration&timezone=Asia%2FTokyo`;

            const [curRes, arcRes] = await Promise.all([fetch(currentUrl), fetch(archiveUrl)]);
            const cur = await curRes.json();
            const arc = await arcRes.json();

            const weatherMap = {0:"快晴", 1:"晴れ", 2:"一部曇", 3:"曇り", 45:"霧", 51:"小雨", 61:"雨", 71:"雪", 95:"雷雨"};
            const curCondition = weatherMap[cur.current.weather_code] || "不明";

            const dObj = new Date(targetDate);
            const dateStr = dObj.toLocaleDateString('ja-JP', { month: '2-digit', day: '2-digit', weekday: 'short' });
            const nowTime = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

            // コピー用テキストも「力強い」印象に整形
            const text = 
`━━━━━━━━━━━━━━
 【 天 気 レ ポ ー ト 】
  📍 ${displayName}
━━━━━━━━━━━━━━

 ● 現在の観測 (${nowTime})
 ──────────────────
  天 気 ： ${curCondition}
  気 温 ： ${cur.current.temperature_2m} ℃
  湿 度 ： ${cur.current.relative_humidity_2m} %
  風 速 ： ${cur.current.wind_speed_10m} m/s

 ● 過去の実績 (${dateStr})
 ──────────────────
  最 高 ： ${arc.daily.temperature_2m_max[0]} ℃
  最 低 ： ${arc.daily.temperature_2m_min[0]} ℃
  湿 度 ： ${Math.round(arc.daily.relative_humidity_2m_mean[0])} %
  降 水 ： ${arc.daily.precipitation_sum[0]} mm
  蒸 発 ： ${arc.daily.et0_fao_evapotranspiration[0]} mm

 ━━━━━━━━━━━━━━
   Open-Meteo Mixed Report`.trim();

            output.textContent = text;
            await navigator.clipboard.writeText(text);
            status.textContent = "✓ 魔法でコピーしたよ！ ✨";

        } catch (err) {
            status.textContent = "エラーになっちゃった 💦";
            output.textContent = err;
        }
    }
</script>
</body>
</html>
